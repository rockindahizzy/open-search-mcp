[project]
name = "web-search-mcp"
version = "0.1.0"
description = "MCP server for keyless web search, fetch, and research"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.0.0",
    "ddgs>=8.0.0",
    "httpx>=0.27.0",
    "trafilatura>=2.0.0",
]

[project.scripts]
web-search-mcp = "web_search_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
