[project]
name = "open-search-mcp"
version = "0.1.0"
description = "Keyless MCP server for web search, fetch, and research via DuckDuckGo + Trafilatura"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "Rocky", email = "rockindahizzy@users.noreply.github.com" },
]
readme = "README.md"
keywords = ["mcp", "search", "duckduckgo", "web-search", "model-context-protocol", "ai-tools"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "mcp[cli]>=1.0.0",
    "ddgs>=8.0.0",
    "httpx>=0.27.0",
    "trafilatura>=2.0.0",
]

[project.scripts]
web-search-mcp = "web_search_mcp.server:main"

[project.urls]
Homepage = "https://github.com/rockindahizzy/open-search-mcp"
Repository = "https://github.com/rockindahizzy/open-search-mcp"
Issues = "https://github.com/rockindahizzy/open-search-mcp/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
